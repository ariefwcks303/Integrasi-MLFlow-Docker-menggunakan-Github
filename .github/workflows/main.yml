name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLproject/train_pca.csv"
  TARGET_VAR: "Credit_Score"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v3

      # Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
      
      # Check Env Variables
      - name: Check Env
        run: |
          echo $CSV_URL
      # Install mlflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow  
          
      # Run as a mlflow project & langsung simpan output lognya
      - name: Run mlflow project
        run: |
          mlflow run MLproject --env-manager=local | tee mlflow_output.log
      
    # 2. CARA BARU: Ambil run_id langsung lewat API internal MLflow (Anti-Gagal)
      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "
          import mlflow
          try:
              # Mengambil semua data run yang ada di local registry (mlruns)
              runs = mlflow.search_runs(order_by=['start_time DESC'], max_results=1)
              if not runs.empty:
                  print(runs.iloc[0]['run_id'])
              else:
                  print('ERROR')
          except Exception:
              print('ERROR')
          ")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id yang berhasil ditangkap: $RUN_ID"
          
      # Build Docker Model
      - name: Build Docker Model
        run: |
          # Pastikan menggunakan format ${{ env.RUN_ID }} (Abaikan jika VS Code memberi garis merah)
          mlflow models build-docker --model-uri "runs:/${{ env.RUN_ID }}/model" --name "cc" 

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Tag the Docker image
      - name: Tag Docker Image
        run: |
          docker tag cc ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest

      # Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
